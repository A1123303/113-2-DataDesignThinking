    <div class="card">
        <h1>My data story: 這是動畫式桃園市中壢區 A11 至 A33 的 curve char</h1>
        <h2>我發現其中年齡 A12 的人口幾乎等於年齡 A11 的一半，<br/>
            而身心障礙 A22 與長照 A33 分別約佔身心障礙 A21 與長照 A32 的十分之一，<br/>
            顯示年齡結構正快速邁向高齡與超高齡社會，照護需求將日益提升。<br/>
            此外，身心障礙與長照人口比例偏低，可能代表潛在照護資源尚未被完全申請或使用。
        </h2>
