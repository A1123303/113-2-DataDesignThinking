<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡片圖文整合</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .card {
            width: 80%;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }
        .card h1 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 15px;
        }
        .card h2 {
            font-size: 1.2em;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>My data story: 這是動畫式桃園市中壢區 A11 至 A33 的 curve char</h1>
        <h2>我發現其中年齡 A12 的人口幾乎等於年齡 A11 的一半，<br/>
            而身心障礙 A22 與長照 A33 分別約佔身心障礙 A21 與長照 A32 的十分之一，<br/>
            顯示年齡結構正快速邁向高齡與超高齡社會，照護需求將日益提升。<br/>
            此外，身心障礙與長照人口比例偏低，可能代表潛在照護資源尚未被完全申請或使用。
        </h2>
    </div>
    <iframe src="https://plotdb.io/v/chart/37113" width="120%" height="600px" allowfullscreen="true" frameborder="0"></iframe>
</body>
</html>
