<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1123303 Data Design: 桃園市65歲以上人口分析</title>
    <style>
        /* 全域樣式 */
        body {
            background-color: #F5E4D7; /* 淡香檳色 */
            font-family: "標楷體", serif; /* 字型設為標楷體 */
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background-color: #F5E4D7;
        }

        header h1 {
            font-size: 2.5em;
            color: #4A4A4A; /* 深灰色 */
            margin: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            padding: 20px;
        }

        /* 圖卡樣式 */
        .card {
            background-color: #D6E1E3; /* 更淺的莫蘭迪藍色 */
            border-radius: 15px;
            padding: 20px;
            max-width: 800px;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15); /* 陰影效果 */
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s; /* 動態效果 */
        }

        .card:hover {
            transform: scale(1.05); /* 放大效果 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25); /* 增強陰影 */
        }

        .card p {
            color: #333;
            font-size: 1.2em;
            margin: 0;
        }

        /* 圖表名稱樣式 */
        .chart-title-card {
            background-color: #CCD2CC; /* 莫蘭迪淺綠色 */
            border-radius: 10px;
            padding: 10px;
            max-width: 800px;
            margin-bottom: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .chart-title-card h2 {
            font-size: 1.5em;
            color: #4A4A4A; /* 深灰色 */
            margin: 0;
        }

        /* 圖表嵌入樣式 */
        iframe {
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: none;
            margin-bottom: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s, box-shadow 0.3s; /* 動態效果 */
        }

        iframe:hover {
            transform: scale(1.03); /* 放大效果 */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25); /* 增強陰影 */
        }

        /* 響應式設計 */
        @media (max-width: 1024px) {
            header h1 {
                font-size: 2em; /* 調整標題大小 */
            }

            .card {
                max-width: 90%;
                padding: 15px;
            }

            .chart-title-card {
                max-width: 90%;
                padding: 10px;
            }

            iframe {
                height: 500px; /* 減少圖表高度 */
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em; /* 更小的標題 */
            }

            .card {
                max-width: 90%;
                padding: 10px;
            }

            .chart-title-card {
                max-width: 90%;
                padding: 8px;
            }

            iframe {
                height: 400px; /* 更小的圖表高度 */
            }
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.5em; /* 手機版標題 */
            }

            .card {
                max-width: 95%;
                padding: 8px;
            }

            .chart-title-card {
                max-width: 95%;
                padding: 5px;
            }

            iframe {
                height: 300px; /* 手機版圖表高度 */
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>桃園市65歲以上高齡人口分析洞察</h1>
    </header>
    <div class="container">
        <!-- 圖卡介紹文字 -->
        <div class="card">
            <p>這裡是介紹文字，您可以在這裡加入關於圖表的描述或背景資料。</p>
        </div>
        <!-- 第一個圖表 -->
        <div class="chart-title-card">
            <h2>桃園市65歲以上高齡人口熱力圖</h2>
        </div>
        <iframe src="https://plotdb.io/v/chart/37322" allowfullscreen="true"></iframe>
        <!-- 第二個圖表 -->
        <div class="chart-title-card">
            <h2>桃園市65歲以上男性高齡人口熱力圖</h2>
        </div>
        <iframe src="https://plotdb.io/v/chart/37333" allowfullscreen="true"></iframe>
        <!-- 第三個圖表 -->
        <div class="chart-title-card">
            <h2>桃園市65歲以上女性高齡人口熱力圖</h2>
        </div>
        <iframe src="https://plotdb.io/v/chart/37340" allowfullscreen="true"></iframe>
    </div>
</body>
</html>
