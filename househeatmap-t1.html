<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A1123303 design: kcg 113-12 population</title>
    <style>
        /* 通用樣式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #D7E3D4; /* 很淺的莫蘭迪綠色 */
        }

        h1, h2 {
            margin: 10px 0;
            color: #333;
        }

        .container {
            display: flex; /* 使用 Flexbox 排版 */
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            align-items: center;
            justify-content: space-between;
        }

        .text {
            flex: 1; /* 文字區域 */
            margin-right: 20px; /* 與圖像保持間距 */
        }

        .iframe-container {
            flex: 1; /* 圖像區域 */
        }

        iframe {
            width: 100%;
            height: 800px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card {
            background-color: #F7E7CE; /* 香檳色 */
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column; /* 小螢幕時改為上下排列 */
            }

            iframe {
                height: 500px;
            }

            h1 {
                font-size: 1.5rem;
            }

            h2 {
                font-size: 1.2rem;
            }

            .text {
                margin-right: 0; /* 移除文字與圖像間距 */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">
            <div class="card">
                <center><h1>桃園市村里人口熱力圖</h1></center>
                <h2>透過點擊縣市中的鄉鎮再顯示村里細節，資料以村里為主。</h2>
            </div>
        </div>
        <div class="iframe-container">
            <iframe src="https://plotdb.io/v/chart/37194" allowfullscreen="true"></iframe>
        </div>
    </div>
</body>
</html>
